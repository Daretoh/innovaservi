<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Checklist de preparación · InnovaServi</title>
<meta name="theme-color" content="#ff6b00" />
<link rel="icon" type="image/png" href="../assets/images/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --orange:#ff6b00; --orange-2:#c24e00; --navy:#1a1f6e; --ink:#1b1f4d; --body:#4a5270; --muted:#8b93a7; --line:#e6e8f2; --alt:#f5f6fb; --card:#fff; --ok:#22a06b; --bad:#dc2626; --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--alt);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
  .head{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
  .head img{height:38px;width:auto}
  .head b{display:block;font-weight:800;font-size:16px;color:var(--navy)}
  .head span{font-size:12px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .res{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .res .w{grid-column:1/-1}
  .res small{display:block;font:700 10.5px var(--font);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
  .res div{font-weight:700;font-size:14.5px;line-height:1.3}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips span{background:var(--alt);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font:600 12.5px var(--font)}
  .tot{display:flex;align-items:center;gap:10px;font:600 13px var(--font);color:var(--body)}
  .bar{flex:1;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
  .sec{margin-top:16px}
  .sec:first-child{margin-top:0}
  .sh{display:flex;align-items:center;gap:7px;margin:0 0 7px;font:800 13px var(--font);color:var(--navy)}
  .sh svg{color:var(--orange-2);flex-shrink:0}
  .sh em{margin-left:auto;font:700 12px var(--font);font-style:normal;color:var(--muted)}
  .sh em.full{color:var(--ok)}
  .row{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1px solid var(--line);border-top:none;background:var(--card);font:500 15px var(--font);color:var(--ink);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .row:first-of-type{border-top:1px solid var(--line);border-radius:11px 11px 0 0}
  .row:last-of-type{border-radius:0 0 11px 11px}
  .row:only-of-type{border-radius:11px}
  .box{width:24px;height:24px;flex-shrink:0;border:2px solid #c5cad8;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;background:#fff}
  .row .n{flex:1;line-height:1.3;overflow-wrap:anywhere}
  .row .n small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .row .c{font-weight:800;color:var(--orange-2);min-width:34px;text-align:right}
  .row.ok{background:#eef8f3}
  .row.ok .box{background:var(--ok);border-color:var(--ok)}
  .row.ok .n{text-decoration:line-through;color:var(--muted)}
  .row.busy{opacity:.55;pointer-events:none}
  .falta{color:var(--orange-2);font-weight:700}
  .msg{text-align:center;padding:34px 18px;color:var(--body)}
  .msg b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:14px;line-height:1.5}
  .step{display:flex;align-items:center;gap:8px;margin:0 0 12px;font:800 14px var(--font);color:var(--navy)}
  .step b{width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;flex-shrink:0}
  .step span{font:600 11.5px var(--font);color:var(--muted);margin-left:auto}
  .fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .foto{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--alt);border:1px solid var(--line)}
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .foto button{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(12,15,46,.72);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .btns{display:flex;gap:8px}
  .bt{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;border-radius:12px;border:1px solid var(--line);background:var(--alt);font:700 14px var(--font);color:var(--ink);cursor:pointer}
  .bt.pri{background:var(--orange);border-color:var(--orange);color:#fff}
  .bt:disabled{opacity:.6}
  .done{display:flex;align-items:center;gap:10px;background:#eef8f3;border:1px solid #bfe5d1;color:#13724a;border-radius:12px;padding:12px 14px;font:700 14px var(--font);margin-bottom:12px}
  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b1f4d;color:#fff;font:600 13px var(--font);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img src="../assets/images/InnovaLOGO.png" alt="" onerror="this.style.display='none'" />
    <div><b>Checklist de preparación</b><span>Innovación y Servicios SpA</span></div>
  </div>
  <div id="app"><div class="card msg">Cargando…</div></div>
  <p class="foot">Marca lo que ya está cargado. Los cambios se guardan solos y los ve todo el equipo.</p>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="in-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="in-gal" accept="image/*" multiple hidden>

<script>
  var SB_URL='https://oabtbzrfgwadnooexdwd.supabase.co';
  var SB_KEY='sb_publishable_Uz01bxGvGArhB-h4KOvbqA_WtQg1zer';
  var sb=null; try{ if(window.supabase) sb=window.supabase.createClient(SB_URL,SB_KEY); }catch(e){}
  var TOKEN=''; try{ TOKEN=new URLSearchParams(location.search).get('t')||''; }catch(_){}
  var D=null, ocupado=false;
  var $=function(i){ return document.getElementById(i); };
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function ico(p){ return '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; }
  var TICK='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var SECS=[
    ['epp','EPP','<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'],
    ['ropa','Ropa de trabajo','<path d="M20.4 6.6 16 4a4 4 0 0 1-8 0L3.6 6.6a1 1 0 0 0-.5 1.2l1.2 3.6a1 1 0 0 0 1.2.6L7 11.5V20a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-8.5l1.5.5a1 1 0 0 0 1.2-.6l1.2-3.6a1 1 0 0 0-.5-1.2z"/>'],
    ['herramienta','Herramientas','<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>'],
    ['maquinaria','Maquinaria','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>']
  ];
  function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ el.classList.remove('on'); },2600); }
  function fecha(f){ if(!f) return '—'; var p=String(f).slice(0,10).split('-'); if(p.length!==3) return f; var d=new Date(+p[0],+p[1]-1,+p[2]);
    var dias=['dom','lun','mar','mié','jue','vie','sáb']; return dias[d.getDay()]+' '+p[2]+'-'+p[1]+'-'+p[0]; }
  function aviso(t,s){ $('app').innerHTML='<div class="card msg"><b>'+esc(t)+'</b>'+esc(s||'')+'</div>'; }

  // Filas a mostrar: cada ítem normal es una fila; la ropa personal se agrupa por prenda y talla.
  function filas(){
    var out={epp:[],ropa:[],herramienta:[],maquinaria:[]}, gk={};
    (D.items||[]).forEach(function(it,i){
      if(!(it.item||'').trim()) return;
      if(it.personal){
        var pr=it.prenda||(/^botas/i.test(it.item)?'botas':'overol'), k=pr+'|'+String(it.talla||'').toUpperCase();
        if(!gk[k]){ gk[k]={prenda:pr, talla:it.talla||'', idx:[], items:[], nombres:[]}; out.ropa.push(gk[k]); }
        gk[k].idx.push(i); gk[k].items.push(it.item); if(it.persona) gk[k].nombres.push(it.persona); return;
      }
      var tp=out[it.tipo]?it.tipo:'herramienta';
      out[tp].push({nombre:it.item, cant:it.cantidad||'', idx:[i], items:[it.item]});
    });
    out.ropa.forEach(function(g){ g.nombre=(g.prenda==='botas'?'Botas':'Overol')+(g.talla?(g.prenda==='botas'?' T':' ')+g.talla:''); g.cant=String(g.idx.length); g.sinTalla=!g.talla; });
    out.ropa.sort(function(a,b){ if(a.prenda!==b.prenda) return a.prenda==='overol'?-1:1; if(!a.talla) return 1; if(!b.talla) return -1;
      var na=parseFloat(a.talla), nb=parseFloat(b.talla); return (!isNaN(na)&&!isNaN(nb))?na-nb:a.talla.localeCompare(b.talla); });
    Object.keys(out).forEach(function(k){ out[k].forEach(function(f){ f.ok=f.idx.every(function(i){ return D.items[i].cargado; }); }); });
    return out;
  }

  // Fotos: el bucket es privado. Se muestran con un enlace firmado (1 h) que Storage entrega solo para
  // la carpeta checklist/<sha256(token)>/ de este link (política checklist_link_read).
  var FIRMA={}, FIRMA_EXP=0, firmando=false, GIF='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  function rutaFoto(u){ var m=/\/storage\/v1\/object\/(?:public|sign|authenticated)\/reportes\/([^?#]+)/.exec(u||''); if(!m) return null; try{ return decodeURIComponent(m[1]); }catch(_){ return m[1]; } }
  function ver(u){ return FIRMA[u]||GIF; }
  function firmarFotos(){
    if(firmando||!sb||!D) return;
    if(FIRMA_EXP && Date.now()/1000>FIRMA_EXP-300){ FIRMA={}; FIRMA_EXP=0; }
    var falta=(D.fotos||[]).map(function(f){ return f.url; }).filter(function(u){ return u && !FIRMA[u]; });
    if(!falta.length) return;
    var paths=[], porRuta={};
    falta.forEach(function(u){ var r=rutaFoto(u); if(r){ paths.push(r); porRuta[r]=u; } else FIRMA[u]=u; });
    function fin(){ paths.forEach(function(r){ if(!FIRMA[porRuta[r]]) FIRMA[porRuta[r]]=porRuta[r]; }); firmando=false; if(!ocupado) render(); }
    if(!paths.length){ setTimeout(render,0); return; }
    firmando=true;
    sb.storage.from('reportes').createSignedUrls(paths,3600).then(function(res){
      ((res&&res.data)||[]).forEach(function(x){ if(x&&x.path&&x.signedUrl&&!x.error&&porRuta[x.path]) FIRMA[porRuta[x.path]]=x.signedUrl; });
      if(!FIRMA_EXP) FIRMA_EXP=Date.now()/1000+3600; fin();
    }, fin);
  }

  function render(){
    var F=filas(), todas=[].concat(F.epp,F.ropa,F.herramienta,F.maquinaria), hechas=todas.filter(function(f){ return f.ok; }).length;
    var html='<div class="card"><div class="res">'+
      '<div><small>Cliente</small><div>'+esc(D.cliente||'—')+'</div></div>'+
      '<div><small>Fecha</small><div>'+esc(fecha(D.fecha))+'</div></div>'+
      '<div class="w"><small>Faena</small><div>'+esc(D.faena||D.trabajo||'—')+'</div></div>'+
      (D.cuadrilla&&D.cuadrilla.length?'<div class="w"><small>Cuadrilla ('+D.cuadrilla.length+')</small><div class="chips">'+D.cuadrilla.map(function(n){ return '<span>'+esc(n)+'</span>'; }).join('')+'</div></div>':'')+
      '</div></div>';
    html+='<div class="card"><div class="tot"><span>Preparado <b>'+hechas+'/'+todas.length+'</b></span><span class="bar"><i style="width:'+(todas.length?Math.round(hechas*100/todas.length):0)+'%"></i></span></div></div>';
    var fotos=D.fotos||[];
    if(todas.length&&hechas===todas.length&&fotos.length) html+='<div class="done">'+TICK+'Preparación completa. ¡Gracias!</div>';
    html+='<div class="card"><div class="step"><b>1</b>Checklist de carga<span>'+hechas+'/'+todas.length+'</span></div>';
    if(!todas.length) html+='<div class="msg" style="padding:16px">Este checklist todavía no tiene ítems.</div>';
    var n=0;
    SECS.forEach(function(s){ var arr=F[s[0]]; if(!arr.length) return;
      var h=arr.filter(function(f){ return f.ok; }).length;
      html+='<div class="sec"><div class="sh">'+ico(s[2])+esc(s[1])+'<em class="'+(h===arr.length?'full':'')+'">'+h+'/'+arr.length+'</em></div>';
      arr.forEach(function(f){ var id='f'+(n++); f.id=id;
        html+='<button type="button" class="row'+(f.ok?' ok':'')+'" data-f="'+id+'"><span class="box">'+(f.ok?TICK:'')+'</span>'+
          '<span class="n">'+esc(f.nombre)+(f.sinTalla?' <span class="falta">sin talla</span>':'')+(f.sinTalla&&f.nombres.length?'<small>'+esc(f.nombres.join(', '))+'</small>':'')+'</span>'+
          '<span class="c">'+(f.cant?'×'+esc(f.cant):'')+'</span></button>';
      });
      html+='</div>';
    });
    html+='</div>';
    // Paso final: foto(s) de la carga general
    html+='<div class="card"><div class="step"><b>2</b>Foto de la carga general<span>último paso</span></div>'+
      '<p class="foot" style="text-align:left;margin:-4px 0 12px">Saca una foto con todo cargado en el vehículo antes de salir.</p>';
    if(fotos.length) html+='<div class="fotos">'+fotos.map(function(f){ return '<div class="foto"><a href="'+esc(ver(f.url))+'" target="_blank" rel="noopener"><img src="'+esc(ver(f.url))+'" alt="Foto de la carga" loading="lazy"></a><button type="button" data-q="'+esc(f.url)+'" aria-label="Quitar foto">'+ico('<path d="M18 6 6 18M6 6l12 12"/>')+'</button></div>'; }).join('')+'</div>';
    html+='<div class="btns"><button type="button" class="bt pri" id="b-cam"'+(subiendo?' disabled':'')+'>'+ico(CAM)+(subiendo?'Subiendo…':(fotos.length?'Otra foto':'Tomar foto'))+'</button>'+
      '<button type="button" class="bt" id="b-gal"'+(subiendo?' disabled':'')+'>'+ico(GAL)+'Galería</button></div>'+'</div>';
    $('app').innerHTML=html;
    var mapa={}; todas.forEach(function(f){ mapa[f.id]=f; });
    document.querySelectorAll('.row[data-f]').forEach(function(b){ b.addEventListener('click',function(){ marcar(mapa[b.dataset.f], b); }); });
    $('b-cam').addEventListener('click',function(){ $('in-cam').click(); });
    $('b-gal').addEventListener('click',function(){ $('in-gal').click(); });
    document.querySelectorAll('.foto button[data-q]').forEach(function(b){ b.addEventListener('click',function(){ if(confirm('¿Quitar esta foto?')) quitarFoto(b.dataset.q); }); });
    firmarFotos();
  }

  // ---- Fotos: se achican a 1600 px (JPEG) y se suben a checklist/<sha256(token)>/ ----
  var CAM='<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>';
  var GAL='<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>';
  var subiendo=false, HASH=null;
  function hashToken(){
    if(HASH) return Promise.resolve(HASH);
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(TOKEN)).then(function(b){ HASH=Array.prototype.map.call(new Uint8Array(b),function(x){ return ('0'+x.toString(16)).slice(-2); }).join(''); return HASH; });
  }
  function achicar(file){
    return new Promise(function(res){
      var url=URL.createObjectURL(file), img=new Image();
      img.onload=function(){ var M=1600, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,M/Math.max(w,h));
        var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
        c.toBlob(function(b){ res(b||file); },'image/jpeg',0.82); };
      img.onerror=function(){ URL.revokeObjectURL(url); res(file); };   // formato que el navegador no lee (ej. HEIC): se sube tal cual
      img.src=url;
    });
  }
  function subirFotos(files){
    if(!sb||subiendo) return; subiendo=true; render();
    var ok=0;
    hashToken().then(function(h){
      return files.reduce(function(p,file,i){ return p.then(function(){
        return achicar(file).then(function(blob){
          var jpg=blob.type==='image/jpeg', ext=jpg?'jpg':((file.name||'').split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
          var key='checklist/'+h+'/'+Date.now()+'_'+i+'.'+ext;
          return sb.storage.from('reportes').upload(key,blob,{contentType:(blob.type||'image/jpeg'),upsert:false}).then(function(r){
            if(r.error) throw r.error;
            var url=sb.storage.from('reportes').getPublicUrl(key).data.publicUrl;
            return sb.rpc('prep_foto',{p_token:TOKEN,p_url:url}).then(function(q){ if(q.error) throw q.error; if(q.data){ D=q.data; ok++; } });
          });
        });
      }); }, Promise.resolve());
    }).then(function(){ subiendo=false; render(); toast(ok===1?'Foto guardada':(ok+' fotos guardadas')); },
      function(e){ subiendo=false; render(); toast(/Máximo/.test((e&&e.message)||'')?'Máximo 12 fotos.':'No se pudo subir la foto. Revisa tu conexión.'); });
  }
  function quitarFoto(url){
    sb.rpc('prep_foto',{p_token:TOKEN,p_url:url,p_quitar:true}).then(function(r){ if(r.error||!r.data){ toast('No se pudo quitar.'); return; } D=r.data; render(); }, function(){ toast('No se pudo quitar.'); });
  }

  function marcar(f,btn){
    if(!f||ocupado) return; ocupado=true; btn.classList.add('busy');
    var nuevo=!f.ok;
    sb.rpc('prep_marcar',{p_token:TOKEN, p_idx:f.idx, p_items:f.items, p_cargado:nuevo}).then(function(r){
      ocupado=false;
      if(r.error||!r.data){ btn.classList.remove('busy'); toast(r.error?'No se pudo guardar. Revisa tu conexión.':'Este link ya no está activo.'); return; }
      D=r.data; render();
    }, function(){ ocupado=false; btn.classList.remove('busy'); toast('No se pudo guardar. Revisa tu conexión.'); });
  }

  function cargar(silencioso){
    if(!sb){ aviso('No se pudo conectar','Revisa tu conexión a internet y vuelve a abrir el link.'); return; }
    if(!TOKEN){ aviso('Link incompleto','Pide el link de nuevo a tu supervisor.'); return; }
    sb.rpc('prep_publica',{p_token:TOKEN}).then(function(r){
      if(r.error){ if(!silencioso) aviso('No se pudo cargar','Revisa tu conexión y vuelve a intentar.'); return; }
      if(!r.data){ aviso('Link no válido','Este link fue desactivado o no existe. Pide uno nuevo a tu supervisor.'); return; }
      if(ocupado) return;
      D=r.data; render();
    }, function(){ if(!silencioso) aviso('No se pudo cargar','Revisa tu conexión y vuelve a intentar.'); });
  }
  ['in-cam','in-gal'].forEach(function(id){ $(id).addEventListener('change',function(){ var fs=[].slice.call(this.files||[]); this.value=''; if(fs.length) subirFotos(fs); }); });
  cargar(false);
  // Ver lo que marcan los demás: refresca cada 20 s y al volver a la pestaña
  setInterval(function(){ if(!document.hidden) cargar(true); },20000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) cargar(true); });
</script>
</body>
</html>
