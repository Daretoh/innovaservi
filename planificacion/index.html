<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planificación — InnovaServi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#1a1f6e; --navy-2:#12163f; --deep:#0c0f2e; --orange:#ff6b00; --orange-2:#c24e00;
    --blue:#1f28b0; --ink:#1b1f4d; --body:#4a5270; --muted:#8b93a7; --line:#e6e8f2; --alt:#f5f6fb; --white:#fff;
    /* categorías */
    --c-limp:#17a2b8; --c-obra:#ff6b00; --c-gen:#22a06b; --c-mant:#7b61ff; --c-otro:#8b93a7;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--alt);color:var(--body);-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  /* Header */
  .pl-header{background:linear-gradient(135deg,#e05e00 0%,#ff6b00 55%,#ff8a2b 130%);color:#fff;padding:20px 24px;position:relative;overflow:hidden;}
  .pl-header::after{content:"";position:absolute;top:-40%;right:-5%;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16) 0%,transparent 62%);}
  .pl-header-in{max-width:1760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:1;flex-wrap:wrap;}
  .pl-brand{display:flex;align-items:center;gap:12px;}
  .pl-brand img{height:34px;width:auto;background:#fff;border-radius:8px;padding:4px 7px;box-shadow:0 2px 8px rgba(0,0,0,.12);}
  .pl-brand .t{font-weight:800;font-size:1.15rem;letter-spacing:.3px;}
  .pl-brand .s{font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.85);font-weight:600;}
  .pl-user{display:flex;align-items:center;gap:10px;font-size:.85rem;color:#dfe3ff;}
  .pl-user .av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:700;}

  /* Toolbar */
  .pl-wrap{max-width:1760px;margin:0 auto;padding:20px 22px 60px;}
  .pl-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .pl-nav{display:flex;align-items:center;gap:10px;}
  .pl-nav button{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;color:var(--ink);transition:.2s;}
  .pl-nav button:hover{border-color:var(--orange);color:var(--orange);}
  .pl-title{font-size:1.5rem;font-weight:800;color:var(--ink);text-transform:capitalize;min-width:230px;text-align:center;}
  .pl-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pl-buscar{font:500 13px var(--font);padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:200px;max-width:42vw;}
  .pl-buscar:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,0,.15);}
  .pl-seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .pl-seg button{border:none;background:transparent;padding:9px 16px;font:700 13px var(--font);color:var(--body);cursor:pointer;}
  .pl-seg button.on{background:var(--orange);color:#fff;}
  .pl-today{border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:10px;font:700 13px var(--font);color:var(--ink);cursor:pointer;}
  .pl-today:hover{border-color:var(--orange);color:var(--orange);}
  .pl-add{background:var(--orange);color:#fff;border:none;padding:10px 18px;border-radius:10px;font:700 13px var(--font);cursor:pointer;box-shadow:0 10px 24px -10px rgba(255,107,0,.6);}
  .pl-add:hover{background:var(--orange-2);}

  /* Leyenda categorías */
  .pl-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .pl-legend span{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;color:var(--body);}
  .pl-legend .dot{width:12px;height:12px;border-radius:3px;}

  /* Grid calendario */
  .cal{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px -30px rgba(26,31,110,.35);}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--orange);color:#fff;}
  .cal-dow div{padding:12px 10px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;text-align:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
  .cell{min-height:128px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;position:relative;transition:background .2s;overflow:hidden;}
  .cell:nth-child(7n){border-right:none;}
  .cell.out{background:var(--alt);}
  .cell.today{background:rgba(255,107,0,.05);}
  .cell:hover{background:var(--alt);}
  .cell .dnum{font-size:.85rem;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;margin-bottom:4px;cursor:pointer;}
  .cell .dnum:hover{background:var(--alt);}
  .cell.out .dnum{color:var(--muted);}
  .cell.today .dnum{background:var(--orange);color:#fff;}
  .ev{display:block;width:100%;text-align:left;border:none;border-left:3px solid var(--c-otro);background:var(--alt);color:var(--ink);font:600 10.5px/1.25 var(--font);padding:2px 5px;border-radius:4px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s;}
  .ev:hover{transform:translateX(2px);filter:brightness(.96);}
  .ev-group{border-left:3px solid var(--muted);background:var(--alt);border-radius:4px;padding:2px 6px;margin-bottom:3px;overflow:hidden;}
  .evg-head{display:block;font:800 10px/1.35 var(--font);color:var(--ink);text-transform:uppercase;letter-spacing:.01em;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .evg-head.plain{font-weight:600;text-transform:none;}
  .evg-head:hover{color:var(--orange);}
  .evg-item{display:block;font:500 10px/1.35 var(--font);color:var(--body);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .evg-item:hover{color:var(--orange);}
  .evg-md{color:var(--orange);font-weight:800;margin-left:3px;}
  .ev-more{font:700 11px var(--font);color:var(--orange-2);cursor:pointer;padding:2px 4px;}

  /* Vista semana: filas más altas */
  .cal.week .cell{min-height:420px;}
  .cal.week .cal-grid{grid-template-columns:repeat(7,1fr);}

  /* Modal detalle */
  .pl-modal{display:none;position:fixed;inset:0;z-index:60;background:rgba(12,15,46,.55);align-items:center;justify-content:center;padding:20px;}
  .pl-modal.show{display:flex;}
  .pl-modal-box{background:#fff;border-radius:16px;width:100%;max-width:440px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);}
  .pl-modal-head{padding:16px 20px;color:#fff;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .pl-modal-head h3{font-size:1.1rem;font-weight:800;line-height:1.3;}
  .pl-modal-head button{background:rgba(255,255,255,.2);border:none;color:#fff;width:30px;height:30px;border-radius:8px;font-size:18px;cursor:pointer;flex-shrink:0;}
  .pl-modal-body{padding:18px 20px;}
  .pl-modal-body .row{display:flex;gap:10px;align-items:center;margin-bottom:12px;color:var(--body);font-size:.92rem;}
  .pl-modal-body .row b{color:var(--ink);}
  .pl-modal-body .cat-chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:700;color:#fff;}
  .pl-desc{background:var(--alt);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.88rem;line-height:1.6;color:var(--body);white-space:pre-line;margin-top:6px;}

  /* Vista Próximos / Búsqueda (agenda) */
  .cal-grid.agenda{display:block;padding:14px 12px;max-width:920px;margin:0 auto;}
  .ag-day{margin-bottom:22px;}
  .ag-dhead{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px;padding-bottom:7px;border-bottom:2px solid var(--line);}
  .ag-dhead b{color:var(--ink);font-size:1.08rem;text-transform:none;letter-spacing:0;font-weight:800;}
  .ag-day.hoy .ag-dhead{border-bottom-color:var(--orange);}
  .ag-hoy-badge{background:var(--orange);color:#fff;font-size:.62rem;padding:2px 8px;border-radius:999px;letter-spacing:.05em;margin-right:4px;}
  .ag-ucard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:11px;padding:11px 15px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .ag-ucard-head{font:800 .82rem/1.2 var(--font);text-transform:uppercase;letter-spacing:.02em;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .ag-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .ag-cnt{background:var(--alt);color:var(--body);font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:999px;}
  .ag-item{padding:6px 0 6px 18px;cursor:pointer;border-top:1px dashed var(--line);}
  .ag-item:first-child{border-top:none;}
  .ag-item:hover .ag-item-tt{color:var(--orange);}
  .ag-item-tt{font-weight:600;font-size:.94rem;color:var(--ink);}
  .ag-hora{color:var(--muted);font-weight:700;font-size:.8rem;margin-left:4px;}
  .ag-item-desc{font-size:.83rem;color:var(--muted);margin-top:2px;white-space:pre-line;line-height:1.5;}

  .pl-foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:22px;}
  .pl-foot a{color:var(--orange-2);font-weight:600;}

  /* Login / formulario / edición */
  .pl-auth{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;padding:8px 16px;border-radius:999px;font:700 13px var(--font);cursor:pointer;}
  .pl-auth:hover{background:#fff;color:var(--orange-2);}
  #auth-label{color:rgba(255,255,255,.92);font-size:.82rem;margin-right:6px;}
  /* Candado: calendario oculto sin login */
  #pl-gate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px 20px;}
  .pl-gate-card{width:100%;max-width:380px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:40px 32px 34px;box-shadow:0 24px 60px -24px rgba(26,31,110,.4);color:var(--ink);}
  .pl-gate-card .gate-logo{width:180px;max-width:74%;height:auto;margin:0 auto 10px;display:block;}
  .pl-gate-card .gate-sub{color:var(--muted);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:22px;}
  .pl-gate-card .fgrid{grid-template-columns:1fr;text-align:left;margin-bottom:14px;}
  .pl-gate-card .pl-add{width:100%;}
  body.locked .pl-header{display:none;}
  body.locked .pl-wrap{display:none;}
  body.locked #pl-gate{display:flex;}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .fgrid label{display:flex;flex-direction:column;gap:5px;font:600 12px var(--font);color:var(--ink);}
  .fgrid label.full{grid-column:1/-1;}
  .fgrid input,.fgrid textarea{font:500 14px var(--font);padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--alt);color:var(--ink);width:100%;box-sizing:border-box;}
  .fgrid input:focus,.fgrid textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,0,.15);background:#fff;}
  .fgrid textarea{resize:vertical;}
  .fbtns{display:flex;justify-content:flex-end;gap:10px;align-items:center;}
  .pl-del-btn{background:#fff;border:1px solid #f0c0c0;color:#dc2626;padding:10px 18px;border-radius:10px;font:700 13px var(--font);cursor:pointer;}
  .pl-del-btn:hover{background:#dc2626;color:#fff;border-color:#dc2626;}

  @media (max-width:760px){
    .pl-title{font-size:1.2rem;min-width:150px;}
    .cell{min-height:92px;padding:5px;}
    .cell .dnum{width:22px;height:22px;font-size:.78rem;}
    .ev{font-size:10px;padding:3px 5px;}
    .cal-dow div{font-size:.6rem;padding:9px 4px;letter-spacing:.5px;}
    .pl-legend{gap:10px;}
  }
</style>
</head>
<body class="locked">

  <header class="pl-header">
    <div class="pl-header-in">
      <div class="pl-brand">
        <img src="../assets/images/InnovaLOGO.png" alt="InnovaServi" onerror="this.style.display='none'"/>
        <div><div class="t">Planificación</div><div class="s">Innova Servi</div></div>
      </div>
      <div class="pl-user"><span id="auth-label"></span><button id="authbtn" class="pl-auth">Iniciar sesión</button></div>
    </div>
  </header>

  <!-- Acceso: login directo con el logo (sistema interno) -->
  <div id="pl-gate">
    <div class="pl-gate-card">
      <img class="gate-logo" src="../assets/images/InnovaServi-completo.png" alt="Innova Servi" onerror="this.style.display='none'">
      <p class="gate-sub">Acceso al sistema</p>
      <div class="fgrid">
        <label class="full">Correo<input type="email" id="l-email" autocomplete="username"></label>
        <label class="full">Contraseña<input type="password" id="l-pass" autocomplete="current-password"></label>
      </div>
      <button id="l-btn" class="pl-add">Entrar</button>
      <div id="l-msg" style="color:#dc2626;font-size:.85rem;margin-top:10px"></div>
    </div>
  </div>

  <div class="pl-wrap">
    <div class="pl-bar">
      <div class="pl-nav">
        <button id="prev" aria-label="Anterior">‹</button>
        <div class="pl-title" id="title">—</div>
        <button id="next" aria-label="Siguiente">›</button>
      </div>
      <div class="pl-actions">
        <input type="search" id="pl-buscar" class="pl-buscar" placeholder="Buscar trabajo o cliente…">
        <button class="pl-today" id="today">Hoy</button>
        <div class="pl-seg"><button data-v="mes" class="on">Mes</button><button data-v="semana">Semana</button><button data-v="proximos">Próximos</button></div>
        <button class="pl-add" id="add">＋ Nuevo trabajo</button>
      </div>
    </div>

    <div class="pl-legend" id="pl-legend"></div>

    <div class="cal" id="cal">
      <div class="cal-dow"><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div></div>
      <div class="cal-grid" id="grid"></div>
    </div>

    <p class="pl-foot">Formato de demostración · datos de ejemplo. Los trabajos reales se importan desde el calendario actual. — <a href="../">Volver a InnovaServi</a></p>
  </div>

  <div class="pl-modal" id="modal">
    <div class="pl-modal-box">
      <div class="pl-modal-head" id="modal-head"><h3 id="modal-title"></h3><button id="modal-close" aria-label="Cerrar">×</button></div>
      <div class="pl-modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Modal nuevo/editar trabajo -->
  <div class="pl-modal" id="form-modal">
    <div class="pl-modal-box">
      <div class="pl-modal-head" style="background:linear-gradient(135deg,#ff6b00,#c24e00)"><h3 id="form-title">Nuevo trabajo</h3><button id="form-close" aria-label="Cerrar">×</button></div>
      <div class="pl-modal-body">
        <div class="fgrid">
          <label>Fecha inicio<input type="date" id="f-fecha"></label>
          <label>Fecha fin <span style="color:#8b93a7;font-weight:400">(si dura varios días)</span><input type="date" id="f-fin"></label>
          <label class="full">Hora<input type="text" id="f-hora" placeholder="09:00 - 13:00 o Todo el día"></label>
          <label class="full">Título<input type="text" id="f-titulo" placeholder="Ej: Limpieza estanque"></label>
          <label class="full">Ubicación / Cliente<input type="text" id="f-ubic" list="f-ubic-list" placeholder="Ej: CERMAQ (elige o escribe)"></label>
          <datalist id="f-ubic-list"></datalist>
          <label class="full">Descripción<textarea id="f-desc" rows="4" placeholder="Detalle, materiales, tareas…"></textarea></label>
          <label class="full" id="f-rep-row">Repetir
            <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap">
              <select id="f-repetir" style="flex:1;min-width:130px"><option value="no">No repetir</option><option value="dia">Cada día</option><option value="semana">Cada semana</option><option value="quincena">Cada 2 semanas</option><option value="mes">Cada mes</option></select>
              <input type="number" id="f-cada" min="1" max="60" value="1" style="width:110px;display:none" title="Separación" placeholder="cada…">
              <input type="number" id="f-veces" min="2" max="52" value="4" style="width:96px;display:none" title="Cuántas veces en total" placeholder="veces">
            </div>
            <span id="f-rep-hint" style="display:none;color:#8b93a7;font-weight:400;font-size:11.5px;margin-top:5px;line-height:1.5"></span>
          </label>
        </div>
        <div class="fbtns"><button class="pl-del-btn" id="f-del" style="display:none">Eliminar</button><button class="pl-add" id="f-save">Guardar</button></div>
      </div>
    </div>
  </div>

<script>
(function(){
  // Color por CLIENTE (ubicación): colores de marca conocidos + color estable por nombre para el resto
  var CLIENTE_COL={
    'CERMAQ':'#00a7c4','KOMATSU':'#153fa6','CUMMINS':'#c8102e','MOWI':'#3a3a3a','VENTISQUEROS':'#0b3a5c',
    'SKRETTING':'#e2231a','SEAGARDEN':'#0e7c5a','GREENSPOT':'#2fa84f','SAL LOBOS':'#8a1a2b','LOBOS':'#8a1a2b',
    'PRIMAR':'#1f5aa8','VERISURE':'#e2231a','AUSTRALIS':'#173a5e','QUEMCHI':'#0f766e','REXIN':'#b8620a'
  };
  function hashCol(s){ var h=0; s=(s||'').toUpperCase(); for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return 'hsl('+(h%360)+',52%,42%)'; }
  function clienteColor(u){ u=(u||'').trim().toUpperCase(); if(!u) return '#8b93a7'; for(var k in CLIENTE_COL){ if(u.indexOf(k)>=0) return CLIENTE_COL[k]; } return hashCol(u); }
  function renderLegend(evs){ evs=evs||EVENTS; var seen={}, list=[]; evs.forEach(function(e){ var u=(e.ubic||'').trim(); if(u && !seen[u.toUpperCase()]){ seen[u.toUpperCase()]=1; list.push(u); } }); list.sort(); var el=document.getElementById('pl-legend'); if(!el)return; el.innerHTML=list.map(function(u){ return '<span><i class="dot" style="background:'+clienteColor(u)+'"></i>'+esc(u)+'</span>'; }).join(''); }
  // ---- Datos reales desde Supabase (tabla eventos) ----
  var SB_URL='https://oabtbzrfgwadnooexdwd.supabase.co';
  var SB_KEY='sb_publishable_Uz01bxGvGArhB-h4KOvbqA_WtQg1zer';
  var sb=null; try{ if(window.supabase) sb=window.supabase.createClient(SB_URL,SB_KEY); }catch(e){}
  var authed=false, userEmail='';
  var EVENTS=[];
  function cargarEventos(cb){
    if(!sb){ if(cb)cb(); return; }
    var all=[], chunk=1000;
    function finish(){ EVENTS=all.map(function(e){ return { id:e.id, fecha:e.fecha, fin:e.fecha_fin||'', serie:e.serie_id||'', hora:(/^all\s*day$/i.test(e.hora||'')?'Todo el día':(e.hora||'')), titulo:e.titulo||'', ubic:e.ubicacion||'', color:clienteColor(e.ubicacion), desc:e.descripcion||'' }; }); if(cb)cb(); }
    function fetchFrom(off){
      sb.from('eventos').select('*').order('fecha',{ascending:true}).range(off, off+chunk-1).then(function(r){
        if(r.error){ console.warn('Supabase:',r.error.message); finish(); return; }
        var d=(r&&r.data)||[]; all=all.concat(d);
        if(d.length===chunk){ fetchFrom(off+chunk); } else { finish(); }
      }, function(err){ console.warn('Supabase err',err); finish(); });
    }
    fetchFrom(0);
  }

  var MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var ref=new Date(2026,7,1); // agosto 2026 (mes con datos de ejemplo)
  var vista='mes', buscar='';
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function todayISO(){ return iso(new Date()); }
  function evFin(e){ return (e.fin && e.fin>=e.fecha)?e.fin:e.fecha; }
  function evsDe(f){ return EVENTS.filter(function(e){ return e.fecha<=f && f<=evFin(e); }); }

  function render(){
    if(buscar){ renderBusqueda(); return; }
    var grid=document.getElementById('grid'); grid.classList.remove('agenda');
    var cal=document.getElementById('cal'); cal.classList.toggle('week',vista==='semana');
    document.querySelector('.cal-dow').style.display=(vista==='proximos')?'none':'';
    if(vista==='proximos'){ renderProximos(); return; }
    var y=ref.getFullYear(), m=ref.getMonth();
    document.getElementById('title').textContent=MES[m]+' '+y;
    var cells=[];
    if(vista==='mes'){

        return '<div class="ev-group" style="border-left-color:'+col+'"><span class="evg-head'+(ubic?'':' plain')+'" style="color:'+col+'"'+(ubic?(' data-ubic="'+enc(ubic)+'" data-f="'+f+'"'):(' data-id="'+e0.id+'"'))+'>'+head+'</span>'+items+'</div>';

    }).join('');
    grid.querySelectorAll('.evg-item').forEach(function(b){ b.addEventListener('click',function(ev){ ev.stopPropagation(); abrir(b.dataset.id); }); });

  // Calcula las fechas de una serie según tipo, separación (cada) y nº de veces
  function fechasSerie(baseISO, repetir, cada, veces){
    var base=new Date(baseISO+'T00:00:00'), out=[]; cada=Math.max(1,cada||1);
    for(var i=0;i<veces;i++){ var fd=new Date(base);
      if(repetir==='dia') fd.setDate(fd.getDate()+cada*i);
      else if(repetir==='semana') fd.setDate(fd.getDate()+7*cada*i);
      else if(repetir==='quincena') fd.setDate(fd.getDate()+14*i);
      else if(repetir==='mes') fd.setMonth(fd.getMonth()+cada*i);
      out.push(fd);
    }
    return out;
  }
  function fmtCorto(d){ return DIAS[d.getDay()].slice(0,3)+' '+d.getDate(); }
  // "cada" (separación) aplica a día / semana / mes; quincena es fijo cada 2 semanas
  function repUsaCada(rep){ return rep==='dia'||rep==='semana'||rep==='mes'; }
  function unidadCada(rep){ return rep==='dia'?'días':(rep==='semana'?'semanas':(rep==='mes'?'meses':'')); }
  function actualizarHintRep(){
    var rep=document.getElementById('f-repetir').value, hint=document.getElementById('f-rep-hint');
    if(rep==='no'){ hint.style.display='none'; return; }
    var cada=Math.max(1,parseInt(document.getElementById('f-cada').value,10)||1);
    var veces=Math.min(Math.max(2,parseInt(document.getElementById('f-veces').value,10)||2),52);
    var fi=document.getElementById('f-fecha').value||todayISO();
    var fs=fechasSerie(fi, rep, cada, veces);
    var muestra=fs.slice(0,6).map(fmtCorto).join(', ');
    var cabecera=repUsaCada(rep)?('Cada '+cada+' '+unidadCada(rep)+' · '):'';
    hint.textContent=cabecera+veces+' fechas: '+muestra+(fs.length>6?' …':'');
    hint.style.display='';
  }
  document.getElementById('f-repetir').addEventListener('change',function(){
    var rep=this.value;

    else if(rep==='mes') document.getElementById('f-cada').title='Repetir cada N meses';

  });

  document.getElementById('f-fecha').addEventListener('change',actualizarHintRep);
  document.getElementById('f-del').addEventListener('click',function(){ if(!editId) return; var ev=EVENTS.filter(function(x){return String(x.id)===String(editId);})[0];
    if(ev && ev.serie){ var q=confirm('Este trabajo es parte de una serie repetida.\n\nAceptar = eliminar TODA la serie.\nCancelar = eliminar solo este.'); if(q){ eliminarSerie(ev.serie); return; } }
    if(confirm('¿Eliminar este trabajo?')) eliminarEvento(editId); });
  function eliminarEvento(id){ if(!sb) return; sb.from('eventos').delete().eq('id',id).then(function(r){ if(r.error){ alert('No se pudo eliminar.'); return; } formModal.classList.remove('show'); modal.classList.remove('show'); cargarEventos(render); }); }
  function eliminarSerie(serie){ if(!sb) return; sb.from('eventos').delete().eq('serie_id',serie).then(function(r){ if(r.error){ alert('No se pudo eliminar la serie.'); return; } formModal.classList.remove('show'); modal.classList.remove('show'); cargarEventos(render); }); }

  document.getElementById('add').addEventListener('click',function(){
    if(!authed){ return; }
    abrirForm(null);
  });

  // La carga real ocurre en applyLock() tras confirmar sesión (calendario privado).
})();
</script>
