name: Validar y versionar

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: write

jobs:
  # 1) Valida que el JS de la PWA compile (red de seguridad antes de desplegar).
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revisar que el JS compile
        run: node .github/scripts/check-js.mjs

  # 2) Sube solo el número de caché del Service Worker (vNNN) cuando cambió app/
  #    y no se subió a mano. Así la PWA siempre se auto-actualiza en los celulares.
  sw-bump:
    if: github.event_name == 'push'
    needs: js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Auto-bump del Service Worker
        run: |
          set -e
          BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          if [ -z "$BASE" ]; then echo "Sin commit previo, nada que hacer."; exit 0; fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "Archivos cambiados:"; echo "$CHANGED"
          APP=$(echo "$CHANGED" | grep -E '^app/' | grep -v '^app/sw\.js$' || true)
          SW=$(echo "$CHANGED" | grep -E '^app/sw\.js$' || true)
          if [ -n "$APP" ] && [ -z "$SW" ]; then
            CUR=$(grep -oE "iserv-registros-v[0-9]+" app/sw.js | head -1 | grep -oE "[0-9]+$")
            NEW=$((CUR + 1))
            sed -i "s/iserv-registros-v${CUR}/iserv-registros-v${NEW}/" app/sw.js
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/sw.js
            git commit -m "SW: auto-bump caché a v${NEW} [skip ci]"
            git push
            echo "Service Worker subido a v${NEW}."
          else
            echo "No hace falta subir el Service Worker (no cambió app/ o ya se subió a mano)."
          fi
